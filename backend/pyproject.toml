[project]
name = "aiweb-backend"
version = "0.1.0"
description = "AI 数据问答：元数据知识库 + NL2SQL"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  "sqlalchemy[asyncio]>=2.0.30,<2.1",
  "alembic>=1.14",
  "asyncpg>=0.30",
  "httpx>=0.27",
  "cryptography>=43",
  "sqlglot>=25.9",
  "pwdlib[argon2]>=0.3.1",
  "pyjwt>=2.15.0",
  "asyncmy>=0.2.9,<0.3",
  "pymysql>=1.2.3",
  "jinja2>=3.1",
  "pgvector>=0.3",
  "networkx>=3.7",
  "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.13",
  "respx>=0.21",
  "python-dotenv>=1.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# 跨模块复用夹具的 pytest 写法：夹具只在自己模块内自动可见，别的模块要用就得 import 进来，
# 而形参必须与它同名才解析得到——F811 把这一手当成"重复定义"，而它正是这条 import 存在的理由。
"tests/integration/test_sync_cache_pg.py" = ["F811"]
"tests/integration/test_sync_enqueue_pg.py" = ["F811"]
"tests/integration/test_sync_events_pg.py" = ["F811"]
"tests/integration/test_sync_events_sse_pg.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
  "pg: 需要真实 PostgreSQL（未配 AIWEB_PG_TEST_DSN 时 skip）",
  "live: 需要真实外部服务或源库",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
